<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengajuan Janji Temu | Labib Hadi Muhendri</title>
  <style>
    :root {
      --umy-green: #0B5E36;
      --umy-gold: #E5A823;
      --umy-maroon: #7A1F2B;
      --bg: #F4F6F4;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --line: #D8D4CF;
      --err: #B3261E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 24px 16px 60px;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-top: 4px solid var(--umy-green);
      padding: 28px;
      border-radius: 4px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--umy-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 22px; color: var(--umy-green); margin-bottom: 6px; }
    p.sub { font-size: 14px; color: #555; margin-bottom: 20px; }
    
    label, legend { display: block; font-weight: 600; margin-top: 14px; font-size: 14px; }
    input, textarea {
      width: 100%; margin-top: 4px; padding: 10px; border: 1px solid var(--line);
      border-radius: 4px; font: inherit; font-size: 14px;
    }
    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 3px solid var(--umy-gold);
    }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .radios { display: flex; gap: 20px; margin-top: 4px; font-size: 14px; }
    .radios label { margin: 0; font-weight: 400; display: flex; align-items: center; gap: 6px; }
    .radios input { width: auto; margin: 0; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .err { color: var(--err); font-size: 13px; margin: 4px 0 0; }
    [aria-invalid="true"] { border-color: var(--err); }
    
    button {
      margin-top: 24px;
      background: var(--umy-green);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 12px 24px;
      font: 700 15px inherit;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #074226; }
    button:disabled { opacity: .6; cursor: wait; }
    .banner { margin-top: 16px; padding: 12px; border-radius: 4px; font-size: 14px; }
    .banner.error { background: #fdecea; color: #7a1410; }
    .banner.ok { background: #eaf6ec; color: #17441f; }
    .hp { position: absolute; left: -9999px; }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card">
  <a href="index.html" class="back-link">&larr; Kembali ke Beranda Profil</a>
  <h1>Formulir Janji Temu</h1>
  <p class="sub">Silakan tentukan jadwal untuk diskusi tatap muka di UMY atau virtual via Google Meet.</p>

  <form id="form" novalidate>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

    <label for="fullName">Nama lengkap</label>
    <input id="fullName" name="fullName" autocomplete="name" placeholder="Nama Anda / Instansi">
    <p class="err" id="fullName-err"></p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com">
    <p class="err" id="email-err"></p>

    <label for="subject">Tujuan pertemuan</label>
    <input id="subject" name="subject" placeholder="Diskusi akademik, proyek, organisasi...">
    <p class="err" id="subject-err"></p>

    <div class="row">
      <div>
        <label for="date">Tanggal</label>
        <input id="date" name="date" type="date">
        <p class="err" id="date-err"></p>
      </div>
      <div>
        <label for="startTime">Mulai</label>
        <input id="startTime" name="startTime" type="time">
        <p class="err" id="startTime-err"></p>
      </div>
      <div>
        <label for="endTime">Selesai</label>
        <input id="endTime" name="endTime" type="time">
        <p class="err" id="endTime-err"></p>
      </div>
    </div>

    <fieldset>
      <legend>Jenis pertemuan</legend>
      <div class="radios">
        <label><input type="radio" name="meetingType" value="google_meet" checked> Google Meet</label>
        <label><input type="radio" name="meetingType" value="offline"> Offline (Tatap Muka)</label>
      </div>
    </fieldset>

    <div id="locWrap" hidden>
      <label for="location">Lokasi Pertemuan</label>
      <input id="location" name="location" placeholder="Misal: Selasar Gedung F / Lab Elektro UMY">
      <p class="err" id="location-err"></p>
    </div>

    <label for="notes">Catatan Tambahan (opsional)</label>
    <textarea id="notes" name="notes" rows="3" placeholder="Poin-poin yang ingin dibahas..."></textarea>
    <p class="err" id="notes-err"></p>

    <button id="btn" type="submit">Kirim Jadwal Janji Temu</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
  // Hubungkan dengan Webhook n8n kamu
  const WEBHOOK_URL = "https://example.com/webhook/booking";

  const $ = id => document.getElementById(id);
  const form = $("form"), btn = $("btn"), msg = $("msg");
  const FIELDS = ["fullName","email","subject","date","startTime","endTime","location","notes"];

  $("date").min = new Date().toISOString().slice(0, 10);
  const meetingType = () => form.meetingType.value;
  form.querySelectorAll('[name="meetingType"]').forEach(r =>
    r.addEventListener("change", () => { $("locWrap").hidden = meetingType() !== "offline"; }));

  function validate(v) {
    const e = {};
    if (v.fullName.length < 2) e.fullName = "Isi nama lengkap";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = "Masukkan email yang valid";
    if (v.subject.length < 3) e.subject = "Isi tujuan pertemuan (min. 3 karakter)";
    if (!v.date) e.date = "Pilih tanggal";
    if (!v.startTime) e.startTime = "Pilih jam mulai";
    if (!v.endTime) e.endTime = "Pilih jam selesai";
    if (v.date && v.startTime && v.endTime) {
      const s = new Date(`${v.date}T${v.startTime}:00+07:00`);
      const en = new Date(`${v.date}T${v.endTime}:00+07:00`);
      if (s < new Date()) e.startTime = "Waktu sudah lewat";
      else if (en <= s) e.endTime = "Jam selesai harus setelah jam mulai";
    }
    if (v.meetingType === "offline" && v.location.length < 3) e.location = "Isi lokasi untuk pertemuan offline";
    if (v.notes.length > 1000) e.notes = "Catatan maksimal 1000 karakter";
    return e;
  }

  function showErrors(e) {
    FIELDS.forEach(k => {
      $(k + "-err").textContent = e[k] || "";
      $(k).setAttribute("aria-invalid", e[k] ? "true" : "false");
      if (e[k]) $(k).setAttribute("aria-describedby", k + "-err"); else $(k).removeAttribute("aria-describedby");
    });
  }

  function banner(type, text) {
    msg.innerHTML = "";
    const d = document.createElement("div");
    d.className = "banner " + type;
    d.textContent = text;
    msg.appendChild(d);
  }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (form.website.value) return;

    const v = Object.fromEntries(FIELDS.map(k => [k, $(k).value.trim()]));
    v.meetingType = meetingType();
    const errors = validate(v);
    showErrors(errors);
    msg.innerHTML = "";
    if (Object.keys(errors).length) {
      banner("error", "Periksa kembali kolom yang ditandai.");
      const first = FIELDS.find(k => errors[k]);
      if (first) $(first).focus();
      return;
    }

    const payload = {
      fullName: v.fullName,
      email: v.email,
      subject: v.subject,
      date: v.date,
      startTime: v.startTime,
      endTime: v.endTime,
      timezone: "Asia/Jakarta",
      meetingType: v.meetingType,
      location: v.meetingType === "offline" ? v.location : "",
      notes: v.notes,
      submittedAt: new Date().toISOString()
    };

    btn.disabled = true;
    btn.textContent = "Mengirim…";
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      banner("ok", "Pengajuan berhasil dikirim! Konfirmasi akan segera diteruskan ke email " + v.email + ".");
      form.reset();
      $("locWrap").hidden = true;
    } catch (err) {
      banner("error", "Pengiriman gagal. Pastikan jaringan internet stabil dan webhook aktif.");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Kirim Jadwal Janji Temu";
    }
  });
</script>
</body>
</html>
